<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-review-flow-title pr-review-flow-desc" id="pr-review-flow-root">
        <title id="pr-review-flow-title">The /pr-review flow</title>
        <desc id="pr-review-flow-desc">Flowchart showing how the review lead resolves a pull request, triages it, sends a recall-biased finder and a precision-biased verifier over it, gates the findings, and either prints a dry-run report or publishes one GitHub review.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pr-review-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pr-review-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pr-review-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #pr-review-flow-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="pr-review-flow-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="pr-review-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="pr-review-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#pr-review-flow-dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- PR → Resolve -->
        <line x1="352" y1="88" x2="352" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <!-- Resolve → Triage -->
        <line x1="352" y1="184" x2="352" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <!-- Triage → Find -->
        <line x1="352" y1="272" x2="352" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <!-- Find → Verify -->
        <line x1="352" y1="368" x2="352" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <!-- Verify → Publish? -->
        <line x1="352" y1="464" x2="352" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <!-- Publish? YES → Dedupe and race check -->
        <line x1="448" y1="540" x2="600" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <!-- Publish? NO → Dry-run report -->
        <line x1="352" y1="584" x2="352" y2="616" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <!-- Dedupe → One review on GitHub (accent: the end of the happy path) -->
        <line x1="688" y1="568" x2="688" y2="600" stroke="#bf4520" stroke-width="1.4" marker-end="url(#pr-review-flow-arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="506" y="520" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="360" y="594" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="603" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start oval: PR -->
        <rect x="248" y="40" width="208" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="248" y="40" width="208" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="352" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull request</text>
        <text x="352" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">number · url · branch</text>

        <!-- Rectangle: Resolve -->
        <rect x="248" y="120" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resolve and fetch</text>
        <text x="352" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">worktree at head · context pack</text>
        <text x="352" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stops: merged · draft · reviewed</text>

        <!-- Rectangle: Triage -->
        <rect x="248" y="216" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Triage</text>
        <text x="352" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trivial, normal, high-risk, large</text>

        <!-- Rectangle: Find -->
        <rect x="248" y="304" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Find candidates</text>
        <text x="352" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recall-biased · angles A to L</text>
        <text x="352" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">high-risk: a 2nd finder, reversed</text>

        <!-- Rectangle: Verify -->
        <rect x="248" y="400" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify and gate</text>
        <text x="352" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">disprove each · cite file:line</text>
        <text x="352" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gate: CONFIRMED, or PLAUSIBLE ≥70</text>

        <!-- Diamond: Publish? -->
        <polygon points="352,496 448,540 352,584 256,540" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--publish?</text>

        <!-- End oval: Dry-run report -->
        <rect x="248" y="616" width="208" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="248" y="616" width="208" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="352" y="636" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dry-run report</text>
        <text x="352" y="650" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local report, nothing posted</text>

        <!-- Rectangle: Dedupe and race check -->
        <rect x="584" y="512" width="208" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="688" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dedupe, race check</text>
        <text x="688" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no reposts · head unmoved</text>

        <!-- End oval: One review on GitHub (accent focal) -->
        <rect x="584" y="600" width="208" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="584" y="600" width="208" height="56" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="688" y="624" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One review on GitHub</text>
        <text x="688" y="640" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">comments + event in one POST</text>

        <!-- Legend -->
        <line x1="40" y1="696" x2="920" y2="696" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="712" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="728" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="738" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="220" y="728" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="738" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="412,734 424,728 436,734 424,740" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="448" y="738" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="604" y1="736" x2="632" y2="736" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pr-review-flow-arrow)"/>
        <text x="640" y="738" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>

        <line x1="768" y1="736" x2="796" y2="736" stroke="#bf4520" stroke-width="1.4" marker-end="url(#pr-review-flow-arrow-accent)"/>
        <text x="804" y="738" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final step</text>
      </svg>
