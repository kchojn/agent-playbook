<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>claude-code-tradecraft social preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* GitHub social preview is 1280x640; the screenshot is taken at the page origin, so the page is the card. */
    html, body { background: #f7f6f1; }
    svg { display: block; width: 1280px; height: 640px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="social-preview-title social-preview-desc">
    <title id="social-preview-title">claude-code-tradecraft</title>
    <desc id="social-preview-desc">Social preview card for the claude-code-tradecraft Claude Code plugin, showing the path from the lead command to the PR review command to the review watcher.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6773"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f7f6f1"/>

    <text x="64" y="140" fill="#5b6773" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">CLAUDE CODE PLUGIN</text>
    <text x="64" y="244" fill="#16212b" font-size="80" font-weight="400" font-family="'Instrument Serif', serif" letter-spacing="-0.02em">claude-code-tradecraft</text>
    <text x="64" y="308" fill="#5b6773" font-size="20" font-weight="400" font-family="'Geist', system-ui, sans-serif">A delegation-first lead, a two-stage PR review, a review watcher, and the sourced rules behind them.</text>

    <!-- Arrows first so the boxes sit on top -->
    <line x1="352" y1="452" x2="496" y2="452" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="784" y1="452" x2="928" y2="452" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>

    <rect x="64" y="416" width="288" height="72" rx="6" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
    <text x="208" y="457" fill="#16212b" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/tradecraft:lead</text>

    <rect x="496" y="416" width="288" height="72" rx="6" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
    <text x="640" y="457" fill="#16212b" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/tradecraft:pr-review</text>

    <rect x="928" y="416" width="288" height="72" rx="6" fill="#f7f6f1"/>
    <rect x="928" y="416" width="288" height="72" rx="6" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
    <text x="1072" y="457" fill="#16212b" font-size="14" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/tradecraft:pr-review-watch</text>
  </svg>
</body>
</html>
