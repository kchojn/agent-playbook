<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The /lead orchestration flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · agent-playbook</p>
    <h1>The /lead orchestration flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lead-flow-title lead-flow-desc">
        <title id="lead-flow-title">The /lead orchestration flow</title>
        <desc id="lead-flow-desc">Flowchart showing how the lead triages an ask, defines and delegates bounded phases to workers, retries or escalates a failed phase, loops until no phase remains, and synthesizes the result.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Ask → Trivial? -->
        <line x1="352" y1="88" x2="352" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Trivial? YES → Do it yourself -->
        <line x1="448" y1="164" x2="600" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Trivial? NO → Define a phase -->
        <line x1="352" y1="208" x2="352" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Define a phase → Delegate -->
        <line x1="352" y1="296" x2="352" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Delegate → Done when met? -->
        <line x1="352" y1="392" x2="352" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Done when met? NO → Retry -->
        <line x1="448" y1="468" x2="600" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Retry → back into Delegate -->
        <path d="M 688 440 V 368 Q 688 360 680 360 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Done when met? YES → Another phase? -->
        <line x1="352" y1="512" x2="352" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Another phase? YES → back to Define a phase -->
        <path d="M 256 588 H 208 Q 200 588 200 580 V 276 Q 200 268 208 268 H 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Another phase? NO → Synthesize (accent: the end of the happy path) -->
        <line x1="448" y1="588" x2="600" y2="588" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="506" y="144" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="360" y="218" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="512" y="448" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="542" y="340" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">RETRY</text>

        <rect x="360" y="522" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="376" y="531" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="164" y="424" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="178" y="433" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="512" y="568" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="577" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start oval: Ask -->
        <rect x="264" y="40" width="176" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="264" y="40" width="176" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="352" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask</text>

        <!-- Diamond: Trivial? -->
        <polygon points="352,120 448,164 352,208 256,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trivial?</text>

        <!-- End oval: Do it yourself -->
        <rect x="600" y="140" width="176" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="600" y="140" width="176" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="688" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Do it yourself</text>
        <text x="688" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a spawn costs more</text>

        <!-- Rectangle: Define a phase -->
        <rect x="264" y="240" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Define a phase</text>
        <text x="352" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">goal · inputs · done when</text>

        <!-- Rectangle: Delegate to a worker -->
        <rect x="264" y="328" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Delegate to a worker</text>
        <text x="352" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scout · implementer · reviewer</text>
        <text x="352" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">qa-runner · deep-reasoner</text>

        <!-- Diamond: Done when met? -->
        <polygon points="352,424 448,468 352,512 256,468" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Done when met?</text>

        <!-- Rectangle: Retry on a stronger model -->
        <rect x="600" y="440" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="688" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retry, never cheaper</text>
        <text x="688" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2nd failure → oracle</text>

        <!-- Diamond: Another phase? -->
        <polygon points="352,544 448,588 352,632 256,588" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Another phase?</text>

        <!-- End oval: Synthesize (accent focal) -->
        <rect x="600" y="560" width="176" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="600" y="560" width="176" height="56" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="688" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Synthesize</text>
        <text x="688" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blocked on me · changed · found</text>

        <!-- Legend -->
        <line x1="40" y1="648" x2="920" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="680" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="220" y="680" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="412,686 424,680 436,686 424,692" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="448" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="604" y1="688" x2="632" y2="688" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="640" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>

        <line x1="768" y1="688" x2="796" y2="688" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="804" y="690" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Final step</text>
      </svg>
    </div>
  </div>
</body>
</html>
