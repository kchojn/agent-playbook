<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The /tradecraft:pr-review flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f6f1;
      --color-ink:     #16212b;
      --color-muted:   #5b6773;
      --color-accent:  #0f766e;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart: claude-code-tradecraft</p>
    <h1>The /tradecraft:pr-review flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-review-flow-title pr-review-flow-desc">
        <title id="pr-review-flow-title">The /tradecraft:pr-review flow</title>
        <desc id="pr-review-flow-desc">Flowchart showing how the review lead resolves a pull request, triages it, sends a recall-biased finder and a precision-biased verifier over it, gates the findings, and either prints a dry-run report or publishes one GitHub review.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(22,33,43,0.12)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6773"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f6f1"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- PR -> Resolve -->
        <line x1="352" y1="88" x2="352" y2="120" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Resolve -> Triage -->
        <line x1="352" y1="184" x2="352" y2="216" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Triage -> Find -->
        <line x1="352" y1="272" x2="352" y2="304" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Find -> Verify -->
        <line x1="352" y1="368" x2="352" y2="400" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Verify -> Publish? -->
        <line x1="352" y1="476" x2="352" y2="496" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Publish? YES -> Dedupe and race check -->
        <line x1="448" y1="540" x2="600" y2="540" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Publish? NO -> Dry-run report -->
        <line x1="352" y1="584" x2="352" y2="616" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Dedupe -> One review on GitHub (accent: the end of the happy path) -->
        <line x1="688" y1="568" x2="688" y2="600" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="504" y="520" width="40" height="12" rx="2" fill="#f7f6f1"/>
        <text x="524" y="529" fill="#5b6773" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="360" y="594" width="24" height="12" rx="2" fill="#f7f6f1"/>
        <text x="372" y="603" fill="#5b6773" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start oval: PR -->
        <rect x="248" y="40" width="208" height="48" rx="20" fill="#f7f6f1"/>
        <rect x="248" y="40" width="208" height="48" rx="20" fill="rgba(22,33,43,0.03)" stroke="#5b6773" stroke-width="1"/>
        <text x="352" y="60" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull request</text>
        <text x="352" y="74" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">number, url, branch</text>

        <!-- Rectangle: Resolve -->
        <rect x="248" y="120" width="208" height="64" rx="6" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="352" y="144" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resolve and fetch</text>
        <text x="352" y="160" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">worktree at head, context pack</text>
        <text x="352" y="172" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">re-review: new author commits only</text>

        <!-- Rectangle: Triage -->
        <rect x="248" y="216" width="208" height="56" rx="6" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="352" y="240" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Triage</text>
        <text x="352" y="256" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trivial, normal, high-risk, large</text>

        <!-- Rectangle: Find -->
        <rect x="248" y="304" width="208" height="64" rx="6" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="352" y="328" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Find candidates</text>
        <text x="352" y="344" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recall-biased, angles A to L</text>
        <text x="352" y="356" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">high-risk: a 2nd finder, reversed</text>

        <!-- Rectangle: Verify -->
        <rect x="248" y="400" width="208" height="76" rx="6" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="352" y="424" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verify and gate</text>
        <text x="352" y="440" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">disprove each, cite file:line</text>
        <text x="352" y="452" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gate: CONFIRMED, or</text>
        <text x="352" y="464" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PLAUSIBLE 70+ (60+ at MEDIUM)</text>

        <!-- Diamond: Publish? -->
        <polygon points="352,496 448,540 352,584 256,540" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="352" y="544" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--publish?</text>

        <!-- End oval: Dry-run report -->
        <rect x="248" y="616" width="208" height="48" rx="20" fill="#f7f6f1"/>
        <rect x="248" y="616" width="208" height="48" rx="20" fill="rgba(22,33,43,0.03)" stroke="#5b6773" stroke-width="1"/>
        <text x="352" y="636" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dry-run report</text>
        <text x="352" y="650" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local report, nothing posted</text>

        <!-- Rectangle: Dedupe and race check -->
        <rect x="584" y="512" width="208" height="56" rx="6" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="688" y="536" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dedupe, race check</text>
        <text x="688" y="552" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no reposts, head unmoved</text>

        <!-- End oval: One review on GitHub (accent focal) -->
        <rect x="584" y="600" width="208" height="56" rx="20" fill="#f7f6f1"/>
        <rect x="584" y="600" width="208" height="56" rx="20" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
        <text x="688" y="624" fill="#16212b" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One review on GitHub</text>
        <text x="688" y="640" fill="#5b6773" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">comments + event in one POST</text>

        <!-- Legend -->
        <line x1="40" y1="696" x2="920" y2="696" stroke="rgba(22,33,43,0.12)" stroke-width="0.8"/>
        <text x="40" y="712" fill="#5b6773" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND: SHAPE CARRIES TYPE</text>

        <rect x="40" y="728" width="24" height="12" rx="6" fill="rgba(22,33,43,0.03)" stroke="#5b6773" stroke-width="1"/>
        <text x="72" y="738" fill="#5b6773" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="220" y="728" width="24" height="12" rx="2" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="252" y="738" fill="#5b6773" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="412,734 424,728 436,734 424,740" fill="#f7f6f1" stroke="#16212b" stroke-width="1"/>
        <text x="448" y="738" fill="#5b6773" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="604" y1="736" x2="632" y2="736" stroke="#5b6773" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="640" y="738" fill="#5b6773" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>

        <line x1="768" y1="736" x2="796" y2="736" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="804" y="738" fill="#5b6773" font-size="8.5" font-family="'Geist', sans-serif">Final step</text>
      </svg>
    </div>
  </div>
</body>
</html>
