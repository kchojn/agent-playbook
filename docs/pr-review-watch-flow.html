<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The /pr-review-watch flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · agent-playbook</p>
    <h1>The /pr-review-watch flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 804" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-review-watch-flow-title pr-review-watch-flow-desc">
        <title id="pr-review-watch-flow-title">The /pr-review-watch flow</title>
        <desc id="pr-review-watch-flow-desc">Flowchart showing one watcher pass: take the lock, find open pull requests that request a review, keep the ones not yet handled, run one headless review process per pull request, and report one line each.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Loop fires → Lock free? -->
        <line x1="352" y1="88" x2="352" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Lock free? NO → Batch still running -->
        <line x1="448" y1="164" x2="600" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Lock free? YES → Find requests -->
        <line x1="352" y1="208" x2="352" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Find requests → Keep the eligible -->
        <line x1="352" y1="304" x2="352" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Keep the eligible → Any PR left? -->
        <line x1="352" y1="412" x2="352" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Any PR left? NO → No new requests -->
        <line x1="448" y1="488" x2="600" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Any PR left? YES → One claude -p per PR (accent: the happy path) -->
        <line x1="352" y1="532" x2="352" y2="564" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- One claude -p per PR → One line per PR -->
        <line x1="352" y1="628" x2="352" y2="660" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="512" y="144" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="360" y="218" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="376" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="512" y="468" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="524" y="477" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="360" y="542" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="376" y="551" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <!-- Start oval: /loop fires -->
        <rect x="248" y="40" width="208" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="248" y="40" width="208" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="352" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A pass starts</text>
        <text x="352" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/loop 15m /pr-review-watch</text>

        <!-- Diamond: Lock free? -->
        <polygon points="352,120 448,164 352,208 256,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lock free?</text>

        <!-- End oval: Batch still running -->
        <rect x="584" y="140" width="208" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="584" y="140" width="208" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="688" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Batch still running</text>
        <text x="688" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">end the pass</text>

        <!-- Rectangle: Find requests -->
        <rect x="248" y="240" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Find requests</text>
        <text x="352" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">requested from me · open</text>
        <text x="352" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not draft · not a bot</text>

        <!-- Rectangle: Keep the eligible -->
        <rect x="248" y="336" width="208" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Keep the eligible</text>
        <text x="352" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">still requested · asked &lt;24 h</text>
        <text x="352" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not reviewed at this head</text>
        <text x="352" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">has a local clone</text>

        <!-- Diamond: Any PR left? -->
        <polygon points="352,444 448,488 352,532 256,488" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any PR left?</text>

        <!-- End oval: No new requests -->
        <rect x="584" y="464" width="208" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="584" y="464" width="208" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="688" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No new requests</text>
        <text x="688" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">release the lock</text>

        <!-- Rectangle: One claude -p per PR (accent focal) -->
        <rect x="248" y="564" width="208" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="352" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One claude -p per PR</text>
        <text x="352" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/pr-review &lt;url&gt; --publish</text>
        <text x="352" y="616" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 at once · 60m cap · unsaved</text>

        <!-- End oval: One line per PR -->
        <rect x="248" y="660" width="208" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="248" y="660" width="208" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="352" y="680" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One line per PR</text>
        <text x="352" y="694" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">event · findings · highest</text>

        <!-- Legend -->
        <line x1="40" y1="740" x2="920" y2="740" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="772" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="782" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="220" y="772" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="782" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="412,778 424,772 436,778 424,784" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="448" y="782" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="604" y1="780" x2="632" y2="780" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="640" y="782" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>

        <line x1="768" y1="780" x2="796" y2="780" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="804" y="782" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>
      </svg>
    </div>
  </div>
</body>
</html>
